<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DyNAMic – Mockup v1 (kiểu NomNam)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Bộ token lấy từ NomNam (nền kem ấm, chữ nâu đen); chỉ khác màu nhấn: xanh chàm */
  :root {
    --bg: hsl(34 45% 96%); --card: hsl(36 60% 99%); --fg: hsl(10 30% 12%);
    --muted: hsl(30 28% 91%); --muted-fg: hsl(15 12% 40%); --border: hsl(30 24% 86%);
    --primary: hsl(243 70% 52%); --primary-fg: #fff; --primary-soft: hsl(243 70% 52% / .10);
    --red: hsl(0 72% 48%); --red-soft: hsl(0 72% 50% / .09);
    --amber: hsl(32 95% 36%); --amber-soft: hsl(36 92% 46% / .13);
    --sky: hsl(200 90% 33%); --green: hsl(152 65% 28%); --green-soft: hsl(152 60% 34% / .12);
    --shadow: 0 1px 2px hsl(10 40% 18% / .04), 0 4px 16px hsl(10 40% 18% / .06);
    --stage: hsl(30 18% 88%);
  }
  .dark {
    --bg: hsl(12 20% 6%); --card: hsl(10 18% 10%); --fg: hsl(34 40% 92%);
    --muted: hsl(10 14% 15%); --muted-fg: hsl(25 12% 64%); --border: hsl(10 14% 18%);
    --primary: hsl(243 90% 78%); --primary-fg: hsl(243 50% 14%); --primary-soft: hsl(243 90% 78% / .14);
    --red: hsl(0 75% 66%); --red-soft: hsl(0 75% 60% / .14);
    --amber: hsl(32 95% 58%); --amber-soft: hsl(32 95% 58% / .15);
    --sky: hsl(199 90% 60%); --green: hsl(152 58% 50%); --green-soft: hsl(152 58% 50% / .15);
    --shadow: 0 1px 2px #0006, 0 4px 16px #0004;
    --stage: hsl(12 16% 11%);
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--stage); color: var(--fg); padding: 24px 16px 60px; -webkit-font-smoothing: antialiased; }
  .top { max-width: 1400px; margin: 0 auto 28px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  .top h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .top p { color: var(--muted-fg); font-size: 13px; margin-top: 2px; }
  .toggle { border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 12px; padding: 9px 16px; font: 600 13px inherit; font-family: inherit; cursor: pointer; box-shadow: var(--shadow); }
  .grid { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { font-size: 13px; font-weight: 700; color: var(--muted-fg); text-align: center; max-width: 340px; }
  figcaption b { color: var(--fg); display: block; font-size: 15px; font-weight: 800; }

  .phone { width: 390px; height: 800px; border-radius: 46px; border: 9px solid hsl(10 15% 14%); background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 20px 50px #0003; }
  .screen { height: 100%; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .status { height: 44px; padding: 14px 26px 0; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .body { flex: 1; overflow: hidden; padding-bottom: 92px; }
  .pad { padding: 0 16px; }

  .hd { padding: 8px 16px 10px; }
  .hd small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); }
  .hd h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .card { background: var(--card); border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 20px; box-shadow: var(--shadow); }

  .sum { padding: 16px; display: flex; gap: 16px; align-items: center; }
  .ring { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .t { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1; }
  .ring .t small { display: block; font-size: 10px; font-weight: 600; color: var(--muted-fg); margin-top: 3px; }
  .sum h3 { font-size: 16px; font-weight: 800; line-height: 1.3; }
  .sum p { font-size: 12.5px; color: var(--muted-fg); margin-top: 3px; line-height: 1.4; }
  .streak { display: inline-flex; gap: 5px; align-items: center; margin-top: 8px; background: var(--amber-soft); color: var(--amber); font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 12px 8px 4px; }
  .strip div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 5px; border-radius: 14px; font-size: 11px; font-weight: 600; color: var(--muted-fg); }
  .strip div b { font-size: 15px; color: var(--fg); font-weight: 700; }
  .strip .on { background: var(--primary); color: var(--primary-fg); }
  .strip .on b { color: var(--primary-fg); }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted-fg); opacity: .5; }
  .dot.ok { background: var(--green); opacity: 1; } .dot.none { background: transparent; }
  .on .dot { background: var(--primary-fg); opacity: .9; }

  .nudges { margin: 10px 16px 0; padding: 4px 4px; }
  .nudge { display: flex; align-items: center; gap: 11px; padding: 9px 12px; font-size: 13px; line-height: 1.35; }
  .nudge + .nudge { border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
  .nudge i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-style: normal; font-size: 15px; flex-shrink: 0; }
  .nudge span { flex: 1; } .nudge span em { font-style: normal; font-weight: 700; }
  .nudge .act { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 6px 11px; border-radius: 10px; white-space: nowrap; }
  .i-red { background: var(--red-soft); } .i-pri { background: var(--primary-soft); } .i-amb { background: var(--amber-soft); } .i-grn { background: var(--green-soft); }

  .sec { padding: 14px 16px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); display: flex; justify-content: space-between; }
  .sec.red { color: var(--red); }
  .task { display: flex; align-items: flex-start; gap: 13px; padding: 11px 16px; min-height: 54px; }
  .chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted-fg); flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; }
  .chk.p3 { border-color: var(--red); } .chk.p2 { border-color: var(--amber); } .chk.p1 { border-color: var(--sky); }
  .chk.done { background: var(--green); border-color: var(--green); color: #fff; }
  .task .m { flex: 1; min-width: 0; }
  .task .n { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .task .s { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted-fg); margin-top: 3px; font-weight: 500; align-items: center; }
  .task .s .late { color: var(--red); font-weight: 700; }
  .pj { display: inline-flex; align-items: center; gap: 5px; } .pj::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .time { font-size: 13px; font-weight: 700; color: var(--muted-fg); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .badge { white-space: nowrap; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); margin-left: 6px; vertical-align: 1px; }
  .done-row { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--muted-fg); }

  .nav { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 0 8px 22px; display: flex; align-items: flex-end; z-index: 5; }
  .nav > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 4px; font-size: 11px; font-weight: 600; color: var(--muted-fg); position: relative; }
  .nav > div svg { width: 22px; height: 22px; margin-top: 6px; position: relative; }
  .nav > div span { position: relative; }
  .nav .act { color: var(--primary); } .nav .act::before { content: ''; position: absolute; top: 4px; width: 56px; height: 32px; border-radius: 99px; background: var(--primary-soft); }
  .fab { width: 56px; height: 56px; border-radius: 18px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; margin: -26px auto 4px; box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 35%, transparent); border: 4px solid var(--bg); box-sizing: content-box; }
  .nav .fabwrap { padding: 0; }
  .fab svg { width: 28px; height: 28px; margin: 0 !important; }

  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 28px 28px 0 0; z-index: 11; padding: 10px 16px 26px; border: 1px solid var(--border); border-bottom: 0; }
  .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--muted-fg); opacity: .3; margin: 0 auto 14px; }
  .inp { width: 100%; background: var(--card); border: 1.5px solid var(--primary); border-radius: 16px; padding: 14px 16px; font-size: 17px; font-weight: 500; color: var(--fg); display: flex; align-items: center; min-height: 54px; }
  .caret { width: 2px; height: 22px; background: var(--primary); margin-left: 1px; animation: bl 1s steps(1) infinite; } @keyframes bl { 50% { opacity: 0; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 13.5px; font-weight: 600; padding: 9px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
  .chip.sel { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
  .chip.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
  .more { margin-top: 14px; font-size: 13.5px; font-weight: 700; color: var(--muted-fg); display: flex; align-items: center; gap: 6px; }
  .btn { margin-top: 16px; height: 50px; border-radius: 16px; background: var(--primary); color: var(--primary-fg); font-weight: 700; font-size: 16px; display: grid; place-items: center; }
  .added { margin: 12px 0 0; font-size: 12.5px; color: var(--green); font-weight: 600; display: flex; gap: 6px; align-items: center; }

  .tt { display: flex; gap: 13px; align-items: flex-start; }
  .tt .chk { width: 28px; height: 28px; margin-top: 3px; }
  .tt h3 { font-size: 21px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em; }
  .prog { margin-top: 18px; } .prog .l { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted-fg); margin-bottom: 6px; }
  .bar { height: 8px; border-radius: 99px; background: var(--muted); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .sub { padding: 9px 2px; display: flex; gap: 12px; align-items: center; font-size: 15px; font-weight: 500; }
  .sub .chk { width: 21px; height: 21px; } .sub.d { color: var(--muted-fg); text-decoration: line-through; }
  .addsub { color: var(--muted-fg); padding: 9px 2px; font-size: 15px; display: flex; gap: 12px; align-items: center; }

  .search { margin: 0 16px; background: var(--muted); border-radius: 14px; padding: 11px 14px; display: flex; gap: 9px; align-items: center; color: var(--muted-fg); font-size: 14px; }
  .area { margin: 12px 16px 0; padding: 14px 16px; }
  .area .top2 { display: flex; align-items: center; gap: 12px; }
  .area .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--primary-soft); }
  .area h4 { font-size: 16px; font-weight: 800; } .area .meta { font-size: 12px; color: var(--muted-fg); font-weight: 500; margin-top: 1px; }
  .area .pct { margin-left: auto; font-weight: 800; font-size: 15px; color: var(--primary); font-variant-numeric: tabular-nums; }
  .proj { margin-top: 12px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
  .proj .r { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; align-items: center; }
  .proj .r span:last-child { font-size: 12px; color: var(--muted-fg); font-weight: 500; }
  .proj .bar i { background: var(--c); }
  .links { margin: 12px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .link { padding: 13px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; }
  .link small { margin-left: auto; color: var(--muted-fg); font-weight: 600; }

  .note { max-width: 1400px; margin: 40px auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px; box-shadow: var(--shadow); font-size: 14px; line-height: 1.6; }
  .note h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .note ul { padding-left: 20px; } .note li { margin: 3px 0; }
</style>
</head>
